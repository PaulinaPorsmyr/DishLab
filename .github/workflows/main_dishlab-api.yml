

name: Build and deploy ASP.Net Core app to Azure Web App - Dishlab-api

on:
  push:
    branches:
      - 'main'
    paths:
      - 'DishLab.API/**'
      - '.github/workflows/main_Dishlab-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet
        run: dotnet build ./DishLab.API/DishLab.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./DishLab.API/DishLab.API.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_84E6D3FDF7B3403281FB8495434353A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D81E8FDF6FB44B45B0D7B8D51E70D655 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_75CC49C4DCF044A4B09873B1C55AD845 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Dishlab-api'
          slot-name: 'Production'
          package: .
